services:
  postgres:
    restart: "no"
    command: ["postgres", "-c", "log_statement=all"]

  embedding:
    restart: "no"

  generative:
    restart: "no"

  reranker:
    restart: "no"

  api:
    command: >-
      sh -c "uv pip install -q debugpy &&
      exec python -Xfrozen_modules=off -m debugpy
      --listen 0.0.0.0:5678 --wait-for-client
      -m fastapi dev --entrypoint main:app --host 0.0.0.0 --port 8000"
    restart: "no"
    env_file: .env.debug
    volumes:
      - ./apps/api/src:/app/src
    ports:
      - 127.0.0.1:5678:5678
