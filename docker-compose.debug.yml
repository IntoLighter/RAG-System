services:
  postgres:
    restart: "no"
    command: ["postgres", "-c", "log_statement=all"]

  embedding:
    restart: "no"

  generative:
    restart: "no"

  reranker:
    restart: "no"

  api:
    command: ["sh", "-c", "pip install debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 -m fastapi dev --entrypoint main:app --host 0.0.0.0 --port 8000"]
    restart: "no"
    env_file: .env.debug    
    volumes:
      - ./apps/api/src:/app/src
    ports:
      - 5678:5678