[tool.uv.workspace]
members = ["apps/api", "apps/migrations"]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[tool.ruff]
src = ["apps/api/src", "apps/migrations"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D1", "D200", "D202", "D203", "D212", "RET504", "COM812", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["INP001"]
"apps/migrations/**" = ["INP001"]
