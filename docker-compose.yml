name: fastapi-rag

x-vllm-healthcheck: &vllm-healthcheck
  test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
  interval: 15s
  timeout: 5s
  retries: 4
  start_period: 900s
  start_interval: 5s

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES__DATABASE}
      POSTGRES_USER: ${POSTGRES__USER}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - 127.0.0.1:${POSTGRES__PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  generative:
    image: vllm/vllm-openai:v0.28.0
    restart: unless-stopped
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      VLLM_USE_V2_MODEL_RUNNER: 0
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - 127.0.0.1:${GENERATIVE__PORT}:8000
    command: >
      ${GENERATIVE__NAME}
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --reasoning-parser qwen3
      --gpu-memory-utilization ${GENERATIVE__GPU_MEMORY_UTILIZATION}
      --max-model-len ${GENERATIVE__MAX_MODEL_LEN}
      --max-num-seqs ${GENERATIVE__MAX_NUM_SEQS}
      --enforce-eager
    healthcheck: *vllm-healthcheck
    gpus: all
    # vLLM measures free GPU memory at startup, so concurrent starts on one GPU can fail
    depends_on:
      embedding:
        condition: service_healthy

  embedding:
    image: vllm/vllm-openai:v0.28.0
    restart: unless-stopped
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - 127.0.0.1:${EMBEDDING__PORT}:8000
    command: >
      ${EMBEDDING__NAME}
      --runner pooling
      --gpu-memory-utilization ${EMBEDDING__GPU_MEMORY_UTILIZATION}
      --max-model-len ${EMBEDDING__MAX_MODEL_LEN}
      --max-num-seqs ${EMBEDDING__MAX_NUM_SEQS}
      --enforce-eager
    healthcheck: *vllm-healthcheck
    gpus: all

  reranker:
    image: vllm/vllm-openai-cpu:v0.28.0
    restart: unless-stopped
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    shm_size: '256mb'
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - 127.0.0.1:${RERANKER__PORT}:8000
    command: >
      ${RERANKER__NAME}
      --runner pooling
      --hf-overrides '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'
      --chat-template /vllm-workspace/examples/pooling/score/template/qwen3_reranker.jinja
      --gpu-memory-utilization ${RERANKER__GPU_MEMORY_UTILIZATION}
      --max-model-len ${RERANKER__MAX_MODEL_LEN}
      --max-num-seqs ${RERANKER__MAX_NUM_SEQS}
      --enforce-eager
    healthcheck: *vllm-healthcheck

  migrations:
    build:
      context: .
      dockerfile: apps/migrations/Dockerfile
    restart: "no"
    env_file: .env
    environment:
      # POSTGRES__PORT in .env is the host port; inside the network postgres listens on 5432
      POSTGRES__PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      POSTGRES__PORT: 5432
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - ${APP__PORT}:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s
    depends_on:
      migrations:
        condition: service_completed_successfully
      generative:
        condition: service_healthy
      embedding:
        condition: service_healthy
      reranker:
        condition: service_healthy

volumes:
  huggingface_cache:
  postgres_data:
