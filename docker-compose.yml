name: fastapi-rag

services:
  postgres:
    container_name: postgres
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES__DATABASE}
      POSTGRES_USER: ${POSTGRES__USER}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - ${POSTGRES__PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  generative:
    container_name: generative
    image: vllm/vllm-openai:v0.28.0
    restart: unless-stopped
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      VLLM_USE_V2_MODEL_RUNNER: 0
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - ${GENERATIVE__PORT}:8000
    command: >
      ${GENERATIVE__NAME}
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --reasoning-parser qwen3
      --gpu-memory-utilization ${GENERATIVE__GPU_MEMORY_UTILIZATION}
      --max-model-len ${GENERATIVE__MAX_MODEL_LEN}
      --max-num-seqs ${GENERATIVE__MAX_NUM_SEQS}
      --enforce-eager
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    gpus: all

  embedding:
    container_name: embedding
    image: vllm/vllm-openai:v0.28.0
    restart: unless-stopped
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - ${EMBEDDING__PORT}:8000
    command: >
      ${EMBEDDING__NAME}
      --runner pooling
      --gpu-memory-utilization ${EMBEDDING__GPU_MEMORY_UTILIZATION}
      --max-model-len ${EMBEDDING__MAX_MODEL_LEN}
      --max-num-seqs ${EMBEDDING__MAX_NUM_SEQS}
      --enforce-eager
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    gpus: all

  reranker:
    container_name: reranker
    image: vllm/vllm-openai-cpu:v0.28.0
    restart: unless-stopped
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    shm_size: '256mb'
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - ${RERANKER__PORT}:8000
    command: >
      ${RERANKER__NAME}
      --runner pooling
      --gpu-memory-utilization ${RERANKER__GPU_MEMORY_UTILIZATION}
      --max-model-len ${RERANKER__MAX_MODEL_LEN}
      --max-num-seqs ${RERANKER__MAX_NUM_SEQS}
      --enforce-eager
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s

  api:
    container_name: api
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - ${APP__PORT}:8000
    depends_on:
      postgres:
        condition: service_healthy
      generative:
        condition: service_healthy
      embedding:
        condition: service_healthy
      reranker:
        condition: service_healthy

volumes:
  huggingface_cache:
  postgres_data:
